# Config IBC per login automatico di IB Gateway in modalità PAPER.
# COMPILA IbLoginId e IbPassword con le credenziali del conto PAPER.
# Questo file resta SOLO sul VPS (è git-ignored) e non deve mai finire nella repo.

# --- credenziali (compila queste due righe sul VPS) ---
IbLoginId=
IbPassword=

# paper trading (mai 'live' finché non decidiamo insieme)
TradingMode=paper

# --- API ---
# Abilita il socket API e la porta 4002 (paper). Il bot si connette qui.
OverrideTwsApiPort=4002
AcceptIncomingConnectionAction=accept
ReadOnlyApi=no
AllowBlindTrading=yes

# --- comportamento headless (evita finestre/prompt che bloccano l'avvio) ---
AcceptNonBrokerageAccountWarning=yes
DismissPasswordExpiryWarning=yes
DismissNSEComplianceNotice=yes
MinimizeMainWindow=yes
ExistingSessionDetectedAction=primary
# i conti paper di solito NON richiedono 2FA; se il tuo lo chiede, il login headless
# non è possibile e va gestito diversamente (dimmelo e troviamo la strada).
